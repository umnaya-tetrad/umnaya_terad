name: Project context
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate-context:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate context and skills
        run: python scripts/check_context.py
      - name: Install shared specification validators
        run: python -m pip install -r project-context/pilot/planning/shared/requirements.txt
      - name: Validate shared API, UX and analytics offline
        run: python project-context/pilot/planning/shared/check_shared.py
      - name: Validate task and acceptance references
        run: python project-context/pilot/planning/check_tasks.py
      - name: Check changed commits for whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] && [[ ! "$BASE_SHA" =~ ^0+$ ]] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git diff --check "$BASE_SHA" HEAD
          else
            git show --format= --check HEAD
          fi
