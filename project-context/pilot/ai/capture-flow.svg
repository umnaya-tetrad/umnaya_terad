<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:921px;height:1093px;background:#FFFDF7;" width="921px" height="1093px" viewBox="0 0 921 1093" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.10?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="921" height="1093" fill="#FFFDF7" style="stroke:none;"/><g class="title" data-source-line="8"><text x="291.935" y="34.533" fill="#000" font-size="14" textLength="336.116" font-weight="700">Съемка комплектов в одной тетради — R80-R82</text></g><ellipse cx="339.528" cy="63.609" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="244.154" y="93.609" width="190.748" height="37.609" fill="#F3F5FF" style="stroke:#5A63B4;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="254.154" y="118.143" fill="#000" font-size="14" textLength="170.748">Открыть текущую тетрадь</text><rect x="212.706" y="195.219" width="253.646" height="37.609" fill="#F3F5FF" style="stroke:#5A63B4;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="222.706" y="219.752" fill="#000" font-size="14" textLength="233.646">Создать новый черновик комплекта</text><rect x="181.811" y="296.828" width="315.436" height="37.609" fill="#F3F5FF" style="stroke:#5A63B4;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="191.811" y="321.361" fill="#000" font-size="14" textLength="295.436">Сфотографировать страницу / выбрать фото</text><rect x="172.996" y="354.438" width="333.065" height="37.609" fill="#F3F5FF" style="stroke:#5A63B4;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="182.996" y="378.971" fill="#000" font-size="14" textLength="313.065">Предпросмотр, пересъемка при необходимости</text><path d="M509.658,414.656 L509.658,450.875 L489.658,454.875 L509.658,458.875 L509.658,495.094 A0,0 0 0 0 509.658,495.094 L856.985,495.094 A0,0 0 0 0 856.985,495.094 L856.985,424.656 L846.985,414.656 L509.658,414.656 A0,0 0 0 0 509.658,414.656" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M846.985,414.656 L846.985,424.656 L856.985,424.656 L846.985,414.656" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="515.658" y="434.189" fill="#000" font-size="14" textLength="277.594">На странице может быть несколько задач.</text><text x="515.658" y="451.799" fill="#000" font-size="14" textLength="326.327">Если решение продолжается на другой странице,</text><text x="515.658" y="469.408" fill="#000" font-size="14" textLength="280.369">добавить ее ДО отправки этого комплекта.</text><text x="515.658" y="487.018" fill="#000" font-size="14" textLength="287.663">Все фото комплекта уйдут одним запросом.</text><rect x="189.398" y="436.07" width="300.26" height="37.609" fill="#F3F5FF" style="stroke:#5A63B4;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="199.398" y="460.604" fill="#000" font-size="14" textLength="280.26">Добавить фото в упорядоченный комплект</text><polygon points="339.528,252.828,351.528,264.828,339.528,276.828,327.528,264.828,339.528,252.828" fill="#F3F5FF" style="stroke:#5A63B4;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><polygon points="211.31,516.875,467.747,516.875,479.747,528.875,467.747,540.875,211.31,540.875,199.31,528.875,211.31,516.875" fill="#F3F5FF" style="stroke:#5A63B4;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="343.528" y="555.408" fill="#000" font-size="14" textLength="24.309">Нет</text><text x="211.31" y="534.604" fill="#000" font-size="14" textLength="256.437">Нажато «Добавить фото к комплекту»?</text><text x="479.747" y="525.799" fill="#000" font-size="14" textLength="17.268">Да</text><polygon points="257.75,575.875,421.307,575.875,433.307,587.875,421.307,599.875,257.75,599.875,245.75,587.875,257.75,575.875" fill="#F3F5FF" style="stroke:#5A63B4;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="257.75" y="593.604" fill="#000" font-size="14" textLength="163.557">Как отправить комплект?</text><text x="93.746" y="584.799" fill="#000" font-size="14" textLength="152.004">Отправить на проверку</text><text x="433.307" y="584.799" fill="#000" font-size="14" textLength="226.844">Отправить и к следующей тетради</text><rect x="66.148" y="609.875" width="213.231" height="37.609" fill="#F3F5FF" style="stroke:#5A63B4;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="76.148" y="634.408" fill="#000" font-size="14" textLength="193.231">Сохранить версию комплекта</text><rect x="16" y="667.484" width="313.528" height="37.609" fill="#F3F5FF" style="stroke:#5A63B4;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="26" y="692.018" fill="#000" font-size="14" textLength="293.528">Поставить одно задание в фоновую очередь</text><rect x="75.408" y="725.094" width="194.713" height="37.609" fill="#F3F5FF" style="stroke:#5A63B4;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="85.408" y="749.627" fill="#000" font-size="14" textLength="174.713">Остаться в той же тетради</text><rect x="399.677" y="609.875" width="213.231" height="37.609" fill="#F3F5FF" style="stroke:#5A63B4;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="409.677" y="634.408" fill="#000" font-size="14" textLength="193.231">Сохранить версию комплекта</text><rect x="349.528" y="667.484" width="313.528" height="37.609" fill="#F3F5FF" style="stroke:#5A63B4;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="359.528" y="692.018" fill="#000" font-size="14" textLength="293.528">Поставить одно задание в фоновую очередь</text><rect x="381.828" y="725.094" width="248.929" height="37.609" fill="#F3F5FF" style="stroke:#5A63B4;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="391.828" y="749.627" fill="#000" font-size="14" textLength="228.929">Закончить текущую сессию съемки</text><polygon points="339.528,768.703,351.528,780.703,339.528,792.703,327.528,780.703,339.528,768.703" fill="#F3F5FF" style="stroke:#5A63B4;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><polygon points="339.528,151.219,351.528,163.219,339.528,175.219,327.528,163.219,339.528,151.219" fill="#F3F5FF" style="stroke:#5A63B4;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><polygon points="215.996,812.703,463.061,812.703,475.061,824.703,463.061,836.703,215.996,836.703,203.996,824.703,215.996,812.703" fill="#F3F5FF" style="stroke:#5A63B4;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="343.528" y="851.236" fill="#000" font-size="14" textLength="24.309">Нет</text><text x="215.996" y="830.432" fill="#000" font-size="14" textLength="247.064">Выбрано продолжение этой тетради?</text><text x="475.061" y="821.627" fill="#000" font-size="14" textLength="17.268">Да</text><path d="M465.553,862.736 L465.553,898.955 L445.553,902.955 L465.553,906.955 L465.553,943.174 A0,0 0 0 0 465.553,943.174 L774.045,943.174 A0,0 0 0 0 774.045,943.174 L774.045,872.736 L764.045,862.736 L465.553,862.736 A0,0 0 0 0 465.553,862.736" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M764.045,862.736 L764.045,872.736 L774.045,872.736 L764.045,862.736" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="471.553" y="882.27" fill="#000" font-size="14" textLength="201.264">Не ждем завершения анализа.</text><text x="471.553" y="899.879" fill="#000" font-size="14" textLength="287.492">Старые задания продолжаются на сервере.</text><text x="471.553" y="917.488" fill="#000" font-size="14" textLength="228.922">Это не завершает проверку класса</text><text x="471.553" y="935.098" fill="#000" font-size="14" textLength="285.476">и не запрещает вернуться в тетрадь позже.</text><rect x="233.504" y="884.15" width="212.049" height="37.609" fill="#F3F5FF" style="stroke:#5A63B4;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="243.504" y="908.684" fill="#000" font-size="14" textLength="192.049">Открыть следующую тетрадь</text><ellipse cx="339.528" cy="974.174" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="339.528" cy="974.174" rx="6" ry="